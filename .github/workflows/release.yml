name: Release Obsidian plugin

# manifest.json 의 version 과 같은 태그(예: 2.0.2)를 push 하면
# main.js / manifest.json / styles.css / versions.json 을 첨부한 GitHub Release 를 만든다.
# 이 플러그인은 빌드 스텝이 없다(순수 JS 단일 파일) → main.js 를 그대로 첨부.
# BRAT 가 이 Release 에서 플러그인을 내려받는다.
on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" \
            --title="$tag" \
            --generate-notes \
            main.js manifest.json styles.css versions.json
